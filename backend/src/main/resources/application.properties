spring.application.name=CrimeAi

server.port=8080


# ===============================
# PostgreSQL Configuration
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# AI Service Configuration
ai.service.base-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
ai.service.timeout-ms=120000
fabric.network.path=${FABRIC_NETWORK_PATH:\\\\wsl.localhost\\Ubuntu-24.04\\home\\lakshya\\fabric-samples\\test-network}
fabric.peer.endpoint=${FABRIC_PEER_ENDPOINT:localhost:7051}
fabric.peer.tlsHostname=${FABRIC_PEER_TLSHOSTNAME:peer0.org1.example.com}
fabric.msp.id=${FABRIC_MSP_ID:Org1MSP}
fabric.cert.path=${FABRIC_CERT_PATH:organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/cert.pem}
fabric.key.path=${FABRIC_KEY_PATH:organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore}
fabric.tls.cert.path=${FABRIC_TLS_CERT_PATH:organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt}
